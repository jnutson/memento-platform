[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-analytics-demo"
version = "0.1.0"
description = "Local manifest-driven retail ingestion MVP"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4.3,<2", "pyarrow>=21,<24"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
memento-ingest = "memento.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
